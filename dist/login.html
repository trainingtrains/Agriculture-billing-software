<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S M AGRI TECH | Login</title>
  <link rel="stylesheet" href="styles.css?v=10">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="auth-view">
  <div class="auth-card">
    <div class="auth-header">
      <img src="logo.png" alt="S M AGRI TECH Logo" class="auth-logo" onerror="this.style.display='none'">
      <h1 id="loginBrandTitle">S M AGRI TECH</h1>
      <p class="auth-subtitle" id="loginBrandSubtitle">AGRICULTURE CHEMICALS & FERTILIZERS · THALAVADI</p>
    </div>
    <form id="standaloneLoginForm" class="auth-form">
      <label>Target Access Environment
        <select id="accessGroupSelect" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; font-weight:600; margin-bottom:12px;">
          <option value="bio">🌿 Login 1: Bio + Nithish + Micro Nutrients Categories</option>
          <option value="chemical_micro" selected>🧪 Login 2: Chemical Only</option>
        </select>
      </label>
      <label>Email Address
        <input id="loginEmailInput" type="email" value="" placeholder="user@example.com" required autocomplete="username">
      </label>
      <label>Password
        <input id="loginPasswordInput" type="password" value="" placeholder="••••••••" required autocomplete="current-password">
      </label>
      <button type="submit" id="submitBtn" class="primary auth-btn">Sign In to Dashboard</button>
      <div id="authErr" class="auth-error" hidden></div>
    </form>

    <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
      <div style="padding:12px; background:#E8F5E9; border:1px solid #A5D6A7; border-radius:8px; text-align:left;">
        <div style="font-weight:700; color:#1B5E20; display:flex; justify-content:space-between; align-items:center;">
          <span>🌿 Bio, Nithish & Micro Nutrients Environment Login</span>
          <button type="button" id="quickBioBtn" style="padding:4px 10px; font-size:12px; background:#2E7D32; color:#fff; border:none; border-radius:4px; cursor:pointer;">Quick Login</button>
        </div>
        <div style="font-size:11.5px; color:#2E7D32; margin-top:4px;">
          Email: <code>bio@agri.com</code> | Pass: <code>Demo@123</code>
        </div>
      </div>

      <div style="padding:12px; background:#E3F2FD; border:1px solid #90CAF9; border-radius:8px; text-align:left;">
        <div style="font-weight:700; color:#0D47A1; display:flex; justify-content:space-between; align-items:center;">
          <span>🧪 Chemical Only Login</span>
          <button type="button" id="quickChemBtn" style="padding:4px 10px; font-size:12px; background:#1565C0; color:#fff; border:none; border-radius:4px; cursor:pointer;">Quick Login</button>
        </div>
        <div style="font-size:11.5px; color:#1565C0; margin-top:4px;">
          Email: <code>chem@agri.com</code> | Pass: <code>Demo@123</code>
        </div>
      </div>
    </div>
    <div class="auth-footer"><small>Protected by Firebase Authentication & Firestore Security Rules</small></div>
  </div>

  <script src="firebase-config.js?v=60"></script>
  <script type="module">
    import { loginUser, initAuth } from './js/auth.js';

    initAuth((user) => {
      if (user) window.location.href = 'index.html';
    });

    const form = document.getElementById('standaloneLoginForm');
    const emailInput = document.getElementById('loginEmailInput');
    const pwdInput = document.getElementById('loginPasswordInput');
    const accessSelect = document.getElementById('accessGroupSelect');

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;
      const pwd = pwdInput.value;
      const group = accessSelect.value;
      try {
        await loginUser(email, pwd, group);
        window.location.href = 'index.html';
      } catch (err) {
        const errEl = document.getElementById('authErr');
        if (errEl) {
          errEl.textContent = err.message || 'Login failed.';
          errEl.hidden = false;
        }
      }
    });

    document.getElementById('quickBioBtn')?.addEventListener('click', async () => {
      emailInput.value = 'bio@agri.com';
      pwdInput.value = 'Demo@123';
      accessSelect.value = 'bio';
      try {
        await loginUser('bio@agri.com', 'Demo@123', 'bio');
        window.location.href = 'index.html';
      } catch (err) {
        alert('Login error: ' + err.message);
      }
    });

    document.getElementById('quickChemBtn')?.addEventListener('click', async () => {
      emailInput.value = 'chem@agri.com';
      pwdInput.value = 'Demo@123';
      accessSelect.value = 'chemical_micro';
      try {
        await loginUser('chem@agri.com', 'Demo@123', 'chemical_micro');
        window.location.href = 'index.html';
      } catch (err) {
        alert('Login error: ' + err.message);
      }
    });
  </script>
</body>
</html>
